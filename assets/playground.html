<title>JSON Logic Playground</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#1c1b1f;
    --ink-dim:#6b6673;
    --accent:#a3199a;
    --mono-bg:#1c1b1f;
    --mono-ink:#f0eef5;
    --mono-line:#38343f;
    --good:#3f7d4f;
    --bad:#af3a3a;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:15px/1.5 'Inter',system-ui,-apple-system,sans-serif;
    padding:24px 16px 48px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{
    font:800 32px/1.15 'Inter',sans-serif;
    letter-spacing:-.01em;
    margin:0 0 24px;
  }
  h1 .accent{color:var(--accent);}
  .field{margin-bottom:22px;}
  .field:last-child{margin-bottom:0;}
  .field h2{
    font:700 15px/1 'Inter',sans-serif;
    color:var(--ink);
    margin:0 0 8px;
  }
  textarea{
    width:100%;
    min-height:120px;
    background:var(--mono-bg);
    color:var(--mono-ink);
    border:1px solid var(--mono-line);
    border-radius:10px;
    font:13px/1.55 'JetBrains Mono',monospace;
    padding:12px 14px;
    resize:vertical;
    tab-size:2;
  }
  textarea:focus{outline:none;border-color:var(--accent);}
  .result{
    font:13px/1.6 'JetBrains Mono',monospace;
    background:var(--mono-bg);
    color:var(--mono-ink);
    border-radius:10px;
    padding:12px 14px;
    min-height:50px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .result.ok{box-shadow:inset 0 0 0 1px var(--good);}
  .result.err{box-shadow:inset 0 0 0 1px var(--bad); color:var(--bad);}
  details > summary{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font:700 15px/1 'Inter',sans-serif;
    color:var(--ink);
    cursor:pointer;
    list-style:none;
  }
  details > summary::-webkit-details-marker{display:none;}
  details > summary::before{content:"▸"; color:var(--accent); font-size:20px; line-height:1;}
  details[open] > summary::before{content:"▾";}
  details > summary::after{
    content:"click to expand";
    color:var(--ink-dim);
    font-weight:500;
    opacity:0;
    transition:opacity .15s;
  }
  details[open] > summary::after{content:"click to collapse";}
  details > summary:hover::after{opacity:1;}
  details textarea{margin-top:8px;}
  details[open] textarea{min-height:160px;}
  .hint{
    margin-top:24px;
    font-size:15px;
    color:var(--ink-dim);
    text-align:center;
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

<div class="wrap">
  <h1><span class="accent">JSON</span> Logic Playground</h1>

  <div class="field">
    <h2>Rule</h2>
    <textarea id="rule" spellcheck="false" style="min-height:220px;"></textarea>
  </div>

  <div class="field">
    <h2>Result</h2>
    <div class="result ok" id="result"></div>
  </div>

  <details class="field">
    <summary>Data</summary>
    <textarea id="data" spellcheck="false"></textarea>
  </details>

  <p class="hint">Rule and data are editable — the page recalculates live. This is the same playground that opens automatically each time the skill runs.</p>
</div>

<script type="module">
import { LogicEngine } from "https://cdn.jsdelivr.net/npm/json-logic-engine@5.0.7/dist/esm/index.js";

const engine = new LogicEngine();
const ruleEl = document.getElementById("rule");
const dataEl = document.getElementById("data");
const resultEl = document.getElementById("result");

function evaluate(){
  try{
    resultEl.textContent = JSON.stringify(engine.run(JSON.parse(ruleEl.value), JSON.parse(dataEl.value)), null, 2);
    resultEl.className = "result ok";
  }catch(e){
    // The engine throws plain objects like {type:"Unknown Operator", key:"foo"}.
    resultEl.textContent = e.message ?? JSON.stringify(e);
    resultEl.className = "result err";
  }
}

// __INITIAL_RULE__ / __INITIAL_DATA__ are replaced with JSON literals before publishing.
// Left untouched, the reference throws and the built-in example is used instead.
let rule, data;
try{ rule = __INITIAL_RULE__; data = __INITIAL_DATA__; }
catch{
  rule = {"if":[{"<":[{"var":"cart.total"},50]}, "no discount", {">=":[{"var":"cart.total"},200]}, "15% off", "5% off"]};
  data = {cart:{total:120}};
}
ruleEl.value = JSON.stringify(rule, null, 2);
dataEl.value = JSON.stringify(data, null, 2);
ruleEl.addEventListener("input", evaluate);
dataEl.addEventListener("input", evaluate);
evaluate();
</script>
