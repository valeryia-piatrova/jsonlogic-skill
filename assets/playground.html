<title>JSON Logic Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#ffffff;
    --accent:#a3199a;
    --mono-bg:#1c1b1f;
    --mono-ink:#f0eef5;
    --mono-line:#38343f;
    --good:#3f7d4f;
    --bad:#af3a3a;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121114; } }
  :root[data-theme="dark"]{ --bg:#121114; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    display:grid;
    gap:8px;
    grid-template:"rule" 2fr "result" 1fr "data" 1fr / 1fr;
  }
  @media (min-width:768px){
    body{ grid-template:"rule data" 1fr "rule result" 1fr / 3fr 2fr; }
  }
  textarea,.result{
    min-height:0;
    width:100%;
    height:100%;
    margin:0;
    background:var(--mono-bg);
    color:var(--mono-ink);
    border:1px solid var(--mono-line);
    border-radius:10px;
    font:13px/1.55 'JetBrains Mono',ui-monospace,monospace;
    padding:12px 14px;
    overflow:auto;
  }
  textarea{resize:none; tab-size:2;}
  textarea:focus{outline:none; border-color:var(--accent);}
  .result{white-space:pre-wrap; word-break:break-word;}
  .result.ok{border-color:var(--good);}
  .result.err{border-color:var(--bad); color:var(--bad);}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">

<textarea id="rule" style="grid-area:rule" spellcheck="false" aria-label="Rule"></textarea>
<output id="result" class="result ok" style="grid-area:result" aria-label="Result" aria-live="polite"></output>
<textarea id="data" style="grid-area:data" spellcheck="false" aria-label="Data"></textarea>

<script type="module">
import { LogicEngine } from "https://cdn.jsdelivr.net/npm/json-logic-engine@5.0.7/dist/esm/index.js";

const engine = new LogicEngine();
const ruleEl = document.getElementById("rule");
const dataEl = document.getElementById("data");
const resultEl = document.getElementById("result");

function evaluate(){
  try{
    resultEl.textContent = JSON.stringify(engine.run(JSON.parse(ruleEl.value), JSON.parse(dataEl.value)), null, 2);
    resultEl.className = "result ok";
  }catch(e){
    // The engine throws plain objects like {type:"Unknown Operator", key:"foo"}.
    resultEl.textContent = e.message ?? JSON.stringify(e);
    resultEl.className = "result err";
  }
}

// __INITIAL_RULE__ / __INITIAL_DATA__ are replaced with JSON literals before publishing.
// Left untouched, the reference throws and the built-in example is used instead.
let rule, data;
try{ rule = __INITIAL_RULE__; data = __INITIAL_DATA__; }
catch{
  rule = {"if":[{"<":[{"var":"cart.total"},50]}, "no discount", {">=":[{"var":"cart.total"},200]}, "15% off", "5% off"]};
  data = {cart:{total:120}};
}
ruleEl.value = JSON.stringify(rule, null, 2);
dataEl.value = JSON.stringify(data, null, 2);
ruleEl.addEventListener("input", evaluate);
dataEl.addEventListener("input", evaluate);
evaluate();
</script>
